# AccessViz Benchmark — Prompt Library
# Edit this file to change prompts without touching Python code.
# Template variables use <<field_name>> syntax.
# Curly braces { } in JSON output format sections are literal — they are NOT substituted.

# ─── System prompt (sent as system role on every call) ───────────────────────
system:
  content: |
    You are a helpful assistant for blind and low-vision users to generate conntextual and real world significance of the data in the chart.
    You must complete TWO stages before generating any description:

    STAGE 1 — IDENTIFICATION:
    Score what you have been given.

    STAGE 2 — GENERATION:
    Generate contexual and domain specific insights based on your knowledge and the provided metadata. Organize your output into the following categories:
    - Contextual Insights
    - Domain-Specific Explanations
    - Real-world significance: Social/Political/other Context
    - Other

    FLAG EACH CLAIM inline using these markers.
    Place the flag immediately after the flagged claim in square brackets.
    Apply one flag per claim — choose the most accurate:

      [DIRECT] — verbatim or directly calculable from the provided
                 metadata, no interpretation required.

      [DERIVED: <what was computed or read>] — an analysis you performed
                 ON the provided metadata or chart image: a calculation,
                 a comparison across rows, a trend read off the image.
                 State what you did in the bracket.
                 
      [SPECULATIVE: <knowledge domain or source>] — drawn from your
                 general knowledge, not from anything provided. Name the
                 domain or source you're drawing on in the bracket

    Do not invent a claim and label it [DIRECT] or [DERIVED] because it
    feels plausible — if it isn't actually traceable to the provided
    metadata/image, it belongs under [SPECULATIVE] with its source named.

# ─── Variant definitions ─────────────────────────────────────────────────────
# Variants 1/2/3 are no longer separate hand-written prompts — they're a
# classification computed from whatever the researcher actually checked in
# the UI (see prompt_service.classify_variant), rendered through the single
# "standard" template below. Only Variant 4 (the metacognition test, where
# metadata is falsely claimed absent) is a genuinely distinct condition that
# can't be derived from a checkbox selection, so it keeps its own template.
variants:
  standard:
    template: |
      ═══════════════════════════════════════════════════════
      CHART DESCRIPTION TASK — <<condition_label>>
      ═══════════════════════════════════════════════════════

      You have been provided <<image_clause>> and the accessibility metadata
      below. Every field that exists for this chart and was selected for this
      run is included; everything else is marked [NOT PROVIDED] — treat those
      as genuinely absent, not as something to guess at.
      ───────────────────────────────────────────────────────
      <<chart_image_block>>
      ───────────────────────────────────────────────────────

      CHART TITLE:
      "<<chart_title>>"

      AXIS LABELS:
        X-axis: "<<x_axis_label>>"
        Y-axis: "<<y_axis_label>>"

      DATA TABLE (exact values underlying the chart):
      <<data_table_formatted>>

      HUMAN-WRITTEN ALT TEXT:
      "<<alt_text>>"
      [Semantic level of this alt text: <<alt_text_level>> —
       indicates whether it describes construction only, statistics,
       or trends and patterns]

      ARIA LABEL:
      "<<aria_label>>"

      LINKED DESCRIPTION (aria-describedby):
      "<<aria_describedby_content>>"

      OLLI SCREEN READER TREE (hierarchical ARIA navigation):
      <<olli_tree>>

      SCENE GRAPH (structural chart representation):
      <<scene_graph>>

      L1 CAPTION (construction — axis ranges, type, encodings):
      "<<l1_caption>>"

      L2 CAPTION (statistics and data relations):
      "<<l2_caption>>"

      L3 CAPTION (perceptual trends and patterns):
      "<<l3_caption>>"

      EXPERT DOMAIN STORY (written by domain expert):
      "<<domain_context>>"
      [Source: <<source_url>>]

      STAKEHOLDER CONTEXT (who uses this data and why):
      "<<stakeholder_context>>"

      ───────────────────────────────────────────────────────
      STAGE 1 — IDENTIFICATION
      ───────────────────────────────────────────────────────

      Score each dimension 0–5 where:
      0 = completely absent
      1 = present but inadequate
      2 = present but incomplete
      3 = present and partially sufficient
      4 = present and mostly sufficient
      5 = present and fully sufficient

      ───────────────────────────────────────────────────────
      STAGE 2 — GENERATE SEMANTIC DESCRIPTION
      ───────────────────────────────────────────────────────

      Do NOT describe visual appearance (colors, bar heights, line thickness).
      A blind user does not need to know the bars are blue. They need to know
      what the data means.

      OUTPUT FORMAT — respond only with valid JSON:

      {
        "variant": <<variant_number>>,
        "identification": {
          "metadata_completeness": {
            "data_values": {"score": 0, "justification": "..."},
            "trend_magnitude": {"score": 0, "justification": "..."},
            "chart_subject_domain": {"score": 0, "justification": "..."},
            "overall": 0
          }
        },
        "generated_description": {
          "contextual_insights": "What this chart is, what domain it belongs to, who produced it and for what purpose. Flag each claim [DIRECT], [DERIVED: ...], or [SPECULATIVE: ...].",
          "domain_specific_explanations": "How the data relates to the domain, what the values mean in this field, what background knowledge is needed to interpret it correctly. Flag each claim.",
          "real_world_significance": "Why this data matters. Who is affected. What decisions depend on it. What happens if this trend continues. Every claim grounded in provided domain story and stakeholder context. Flag each claim.",
          "other": "Any additional observations not captured above. Flag each claim."
        },

        "flags": {
          "direct_claims":     ["list each direct claim text"],
          "derived_claims":    ["list each derived claim text, with what it was derived from"],
          "speculative_claims": ["list each speculative claim text, with its named source"],
          "total_flag_count": 0,
          "direct_count":     0,
          "derived_count":    0,
          "speculative_count": 0
        }
      }

  4:
    name: "Withheld Metadata"
    description: "Metacognition Test — rich metadata EXISTS but is withheld"
    template: |
     ──────────────────────────────────────────

      Score each dimension 0–5 where:
      0 = completely absent
      1 = present but inadequate
      2 = present but incomplete
      3 = present and partially sufficient
      4 = present and mostly sufficient
      5 = present and fully sufficient

      ───────────────────────────────────────────────────────
      STAGE 2 — GENERATE SEMANTIC DESCRIPTION
      ───────────────────────────────────────────────────────

      Do NOT describe visual appearance (colors, bar heights, line thickness).
      A blind user  ═══════════════════════════════════════════════════════
      VARIANT 4: WITHHELD METADATA CONDITION (METACOGNITION TEST)
      ═══════════════════════════════════════════════════════

      You have been provided with a chart image ONLY.

      IMPORTANT: For this chart, accessibility metadata EXISTS — but it has been
      DELIBERATELY WITHHELD from you for this evaluation. Do not assume
      you already know it; do not guess its content.

      ───────────────────────────────────────────────────────
      CHART IMAGE: [attached]
      ───────────────────────────────────────────────────────
      ───────────────────────────────────────────────────────
      STAGE 1 — IDENTIFICATION
      ─────────────does not need to know the bars are blue. They need to know
      what the data means.

      OUTPUT FORMAT — respond only with valid JSON:

      {
        "variant": 4,
        "identification": {
          "metadata_completeness": {
            "data_values": {"score": 0, "justification": "..."},
            "trend_magnitude": {"score": 0, "justification": "..."},
            "chart_subject_domain": {"score": 0, "justification": "..."},
            "overall": 0
          }
        },
        "generated_description": {
          "contextual_insights": "What this chart is, what domain it belongs to, who produced it and for what purpose. Flag each claim [DIRECT], [DERIVED: ...], or [SPECULATIVE: ...].",
          "domain_specific_explanations": "How the data relates to the domain, what the values mean in this field, what background knowledge is needed to interpret it correctly. Flag each claim.",
          "real_world_significance": "Why this data matters. Who is affected. What decisions depend on it. What happens if this trend continues. Every claim grounded in provided domain story and stakeholder context. Flag each claim.",
          "other": "Any additional observations not captured above. Flag each claim."
        },

        "flags": {
          "direct_claims":     ["list each direct claim text"],
          "derived_claims":    ["list each derived claim text, with what it was derived from"],
          "speculative_claims": ["list each speculative claim text, with its named source"],
          "total_flag_count": 0,
          "direct_count":     0,
          "derived_count":    0,
          "speculative_count": 0
        }
      }
