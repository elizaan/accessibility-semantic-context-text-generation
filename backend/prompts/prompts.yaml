      DOMAIN CONTEXT: [NOT PROVIDED]
      STAKEHOLDER CONTEXT: [NOT PROVIDED]
      EXPERT INTERPRETATION: [NOT PROVIDED]
      LINKED DESCRIPTION: [NOT PROVIDED]

      ───────────────────────────────────────────────────────
      STAGE 1 — IDENTIFICATION
      ───────────────────────────────────────────────────────
      
      Score each dimension 0–5 where:
      0 = completely absent
      1 = present but inadequate
      2 = present but incomplete
