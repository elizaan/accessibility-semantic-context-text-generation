        },
        "generated_description": {
          "contextual_insights": "What this chart is, what domain it belongs to, who produced it and for what purpose. [CONFIRMED/ESTIMATED/SPECULATIVE/UNVERIFIED] after each claim.",
          "domain_specific_explanations": "How the data relates to the domain, what the values mean in this field, what background knowledge is needed to interpret it correctly. Flag each claim.",
          "real_world_significance": "Why this data matters. Who is affected. What decisions depend on it. What happens if this trend continues. Every claim grounded in provided domain story and stakeholder context. Flag each claim.",
          "other": "Any additional observations not captured above. Flag each claim."
        },

        "flags": {
          "direct_claims":   ["list each confirmed claim text"],
          "speculative_claims": ["list each speculative claim text"],
          "unverified_claims":  ["list each unverified claim text"],
          "total_flag_count": 0,
